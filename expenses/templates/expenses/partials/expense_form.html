<!-- Reusable expense form. Used by the modal and the standalone add page. -->
{# Django: point action at {% url 'add_expense' %} and POST the form. #}
<form class="expense-form" method="post" action="{% url 'add_expense' %}" id="expense-form" novalidate>
    {% csrf_token %}

    <div class="form-row">
        <label class="form-field">
            <span class="form-label">Title</span>
            <input type="text" name="title" id="exp-title" placeholder="e.g. Grocery run" required maxlength="100">
            <small class="form-error" data-for="exp-title"></small>
        </label>
    </div>

    <div class="form-row form-row-2col">
        <label class="form-field">
            <span class="form-label">Amount</span>
            <div class="input-affix">
                <span class="affix-prefix">৳</span>
                <input type="number" name="amount" id="exp-amount" placeholder="0.00" step="0.01" min="0" required>
            </div>
            <small class="form-error" data-for="exp-amount"></small>
        </label>

        <label class="form-field">
            <span class="form-label">Transaction Type</span>
            <select name="transaction_type" id="exp-type" required>
                <option value="expense" selected>Expense</option>
                <option value="income">Income</option>
            </select>
        </label>

        <label class="form-field">
            <span class="form-label">Category</span>
            <select name="category" id="exp-category" required>
                <option value="" disabled selected>Select category</option>
                <option value="Food">🍔 Food</option>
                <option value="Utilities">🔌 Utilities</option>
                <option value="Transport">🚗 Transport</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Health">💊 Health</option>
                <option value="Entertainment">🎬 Entertainment</option>
                <option value="Education">📚 Education</option>
                <option value="Income">💰 Income</option>
                <option value="Other">📦 Other</option>
            </select>
            <small class="form-error" data-for="exp-category"></small>
        </label>
    </div>

    <div class="form-row form-row-2col">
        <label class="form-field">
            <span class="form-label">Date</span>
            <input type="date" name="date" id="exp-date" value="{{ today|date:'Y-m-d' }}" required>
            <small class="form-error" data-for="exp-date"></small>
        </label>

        <label class="form-field">
            <span class="form-label">Payment method</span>
            <select name="payment_method" id="exp-method">
                <option value="" selected>Select payment method</option>
                <option value="cash">💵 Cash</option>
                <option value="card">💳 Card</option>
                <option value="bank">🏦 Bank Transfer</option>
                <option value="mobile">📱 Mobile Banking</option>
            </select>
        </label>
    </div>

    <div class="form-row">
        <label class="form-field">
            <span class="form-label">Note <span class="optional">(optional)</span></span>
            <textarea name="note" id="exp-note" rows="2" placeholder="Add a note..."></textarea>
        </label>
    </div>

    <div class="form-actions">
        <button type="button" class="ghost-button" data-close-modal>Cancel</button>
        <button type="submit" class="primary-button">Save Expense</button>
    </div>
</form>
